# Forge — Domain Registry
#
# AUTHORITATIVE. Agents resolve every path, command, tier, and agent assignment from
# this file. Do not guess paths or invent build commands — if a domain is not listed
# here, that is a blocking error: run the `scaffold-domain` skill
# (.github/skills/scaffold-domain/SKILL.md) to register it.
#
# See .github/instructions/constitution.instructions.md §I (ownership) and §II (tiers).

version: 1

# ---------------------------------------------------------------------------
# Languages.
#
# .NET is the default. A domain may declare `language:` to opt into another.
# `language` is orthogonal to `kind` — a Node tool is still a `tool` at tier 2.
# Adding a language requires a constitution section, scaffolding support, and an
# ADR (see docs/adr/0002). Do not admit one by precedent.
# ---------------------------------------------------------------------------
languages:
  dotnet:
    default: true
    test: node:test is not applicable — xUnit + FluentAssertions + NSubstitute
    format: dotnet csharpier format .
    constitution: "IV / C# / .NET"
  powershell:
    implied_by_kind: script
    test: Pester v5
    lint: Invoke-ScriptAnalyzer -Severity Error
    constitution: "IV / PowerShell"
  node:
    test: node --test
    format: npx prettier --write .
    constitution: "IV / JavaScript / Node.js"
    rationale: >
      Permitted where the ecosystem is the reason for the work — headless browser
      automation, ffmpeg orchestration. ESM only, no bundler, pinned engines.
      See docs/adr/0002-admit-nodejs-for-ecosystem-bound-tooling.md.

# ---------------------------------------------------------------------------
# Kind defaults — a domain inherits these from the root folder it lives under.
# A domain entry may override `tier`, `builder`, or `reviewer` with justification.
# ---------------------------------------------------------------------------
kinds:
  app:
    root: apps
    tier: 2
    builder: app-builder
    reviewer: app-reviewer
    checklist: .github/checklists/app-design-checklist.md
    description: Desktop applications — WinUI 3, WPF, console UX.

  service:
    root: services
    tier: 1
    builder: service-builder
    reviewer: service-reviewer
    checklist: .github/checklists/service-design-checklist.md
    description: Long-running services and HTTP APIs — ASP.NET Core, workers.

  lib:
    root: libs
    tier: 1
    builder: service-builder
    reviewer: service-reviewer
    checklist: .github/checklists/service-design-checklist.md
    description: Shared libraries consumed by more than one domain. Highest blast radius.

  tool:
    root: tools
    tier: 2
    builder: tooling-builder
    reviewer: tooling-reviewer
    checklist: .github/checklists/tooling-design-checklist.md
    description: Developer tooling — CLIs, generators, analyzers.

  script:
    root: scripts
    tier: 2
    builder: tooling-builder
    reviewer: tooling-reviewer
    checklist: .github/checklists/script-design-checklist.md
    description: PowerShell automation and useful one-liners.

  spike:
    root: spike
    tier: 0
    builder: researcher
    reviewer: none
    checklist: none
    description: >
      Throwaway experiments answering one question. Excluded from Forge.sln.
      Nothing outside spike/ may depend on anything inside it. Graduates or
      retires per constitution §XI.

# ---------------------------------------------------------------------------
# Model pinning — constitution §VIII. The orchestrator MUST pass these explicitly.
# Never rely on a default model; never run builder and reviewer in the same family.
# ---------------------------------------------------------------------------
models:
  builder: claude-opus-5
  reviewer: gpt-6-sol
  planner: claude-opus-5
  researcher: claude-opus-5
  # If a pinned model is unavailable, substitute the newest model of the SAME family.
  # builder and reviewer MUST stay in different families (constitution SS VIII).
  families:
    claude-opus-5: anthropic
    gpt-6-sol: openai

# ---------------------------------------------------------------------------
# Repo-wide commands.
# ---------------------------------------------------------------------------
repo:
  solution: Forge.sln
  build: dotnet build Forge.sln
  test: dotnet test Forge.sln
  format: dotnet csharpier format .
  format_check: dotnet csharpier check .
  script_lint: Invoke-ScriptAnalyzer -Path scripts -Recurse -Severity Error
  github_repo: jacen555/demo
  default_branch: main

# ---------------------------------------------------------------------------
# Domains.
#
# Each entry:
#   id:        kebab-case, unique. Used as the Conventional Commit scope (SS X).
#   kind:      app | service | lib | tool | script | spike
#   language:  dotnet (default, omit) | node | powershell
#   path:      domain root, relative to repo root
#   source:    production code path
#   tests:     test project path, or `none`
#   project:   .csproj / package.json / .ps1 path, or `none`
#   build:     exact build command, or `none`
#   test_cmd:  exact test command, or `none`
#   tier:      inherited from kind unless overridden (state why in `notes`)
#   question:  REQUIRED for spikes — the one question the spike answers
#   status:    active | parked | answered | graduated | retired
#   notes:     free text — overrides, dependencies, gotchas
#
# Template (copy, do not edit in place):
#
#   - id: ledger
#     kind: service
#     path: services/Ledger
#     source: services/Ledger/src
#     tests: services/Ledger/tests
#     project: services/Ledger/src/Forge.Ledger.csproj
#     build: dotnet build services/Ledger/src/Forge.Ledger.csproj
#     test_cmd: dotnet test services/Ledger/tests/Forge.Ledger.Tests.csproj
#     tier: 1
#     status: active
#     notes: Depends on libs/Core for the Money type.
# ---------------------------------------------------------------------------
domains:
  - id: sizzlecraft
    kind: tool
    language: node
    path: tools/SizzleCraft
    source: tools/SizzleCraft/src
    tests: tools/SizzleCraft/tests
    project: tools/SizzleCraft/package.json
    build: none
    test_cmd: node --test "tools/SizzleCraft/tests/**/*.test.mjs"
    tier: 2
    builder: tooling-builder
    reviewer: tooling-reviewer
    checklist: .github/checklists/tooling-design-checklist.md
    status: active
    notes: ''
  - id: eval-engine
    kind: lib
    path: libs/EvalEngine
    source: libs/EvalEngine/src
    tests: libs/EvalEngine/tests
    project: libs/EvalEngine/src/Forge.EvalEngine.csproj
    build: dotnet build libs/EvalEngine/src/Forge.EvalEngine.csproj
    test_cmd: dotnet test libs/EvalEngine/tests/Forge.EvalEngine.Tests.csproj
    tier: 1
    builder: service-builder
    reviewer: service-reviewer
    checklist: .github/checklists/service-design-checklist.md
    status: active
    notes: ''
  - id: eval-cli
    kind: tool
    path: tools/EvalCli
    source: tools/EvalCli/src
    tests: tools/EvalCli/tests
    project: tools/EvalCli/src/Forge.EvalCli.csproj
    build: dotnet build tools/EvalCli/src/Forge.EvalCli.csproj
    test_cmd: dotnet test tools/EvalCli/tests/Forge.EvalCli.Tests.csproj
    tier: 2
    builder: tooling-builder
    reviewer: tooling-reviewer
    checklist: .github/checklists/tooling-design-checklist.md
    status: active
    notes: ''

  - id: playwright-ui-capture
    kind: spike
    language: node
    path: spike/playwright-ui-capture
    source: spike/playwright-ui-capture/src
    tests: none
    project: spike/playwright-ui-capture/package.json
    build: npm --prefix spike/playwright-ui-capture run build
    test_cmd: none
    tier: 0
    builder: researcher
    reviewer: none
    checklist: none
    question: >
      Can Playwright drive a real web UI while capturing deterministic, frame-accurate
      output suitable for the existing SizzleCraft video pipeline — including a visible
      synthetic cursor, per-segment speed control, and zoom?
    status: answered
    notes: >
      Resolved the design fork between Playwright recordVideo (Option A) and scripted
      interaction + per-frame capture with page.clock pinning (Option B). Answer: Option B
      — recordVideo is structurally disqualified (fps hardcoded to 25, frames bucketed by
      compositor wall-clock, >=1s wall-clock tail). See
      docs/adr/0003-drive-real-uis-with-scripted-playwright-frame-capture.md.
      Disposition: graduate into tools/SizzleCraft (sizzlecraft, tier 2) as a SIBLING
      capture path — must be rewritten under tier-2 gates, not moved (constitution §XI).
      Retain until that task lands: this is the executable reference for the three
      determinism controls. Excluded from Forge.sln; nothing outside spike/ references it.
      `build` is a syntax gate (node --check over src), not a compile step.

